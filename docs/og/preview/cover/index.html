<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Docsmith | Docsmith</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c141d; }
</style>
</head>
<body data-docsmith-og-card>
<div class="og-card">
    <div class="og-card-accent" aria-hidden="true"></div>
    <header class="og-card-header">
        <span class="og-card-brand">Docsmith</span>
    </header>
    <main class="og-card-body">
        <h1 class="og-card-title">Docsmith</h1>
        <p class="og-card-description">Craft static documentation sites from Markdown with minimal setup.</p>
    </main>
    <footer class="og-card-footer">
        <span class="og-card-site">Docsmith</span>
    </footer>
</div>
<style>
    .og-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 1200px;
        height: 630px;
        padding: 72px 84px 64px;
        color: #e9f1fb;
        background: radial-gradient(circle at 0% 0%, #16293c 0%, #0c141d 62%, #08131f 100%);
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
    }

    .og-card-accent {
        position: absolute;
        top: 0;
        left: 0;
        width: 10px;
        height: 630px;
        background: #ff2d20;
    }

    .og-card-header {
        display: flex;
        align-items: center;
    }

    .og-card-brand {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #a6b8cc;
    }

    .og-card-title {
        max-width: 940px;
        font-size: 64px;
        line-height: 1.08;
        letter-spacing: -0.025em;
        margin-bottom: 26px;
    }

    .og-card-description {
        max-width: 900px;
        font-size: 28px;
        line-height: 1.4;
        color: #a6b8cc;
    }

    .og-card-footer {
        padding-top: 30px;
        border-top: 1px solid #2a4157;
    }

    .og-card-site {
        font-size: 22px;
        font-weight: 600;
        color: #ff2d20;
    }
</style>
</body>
</html>
